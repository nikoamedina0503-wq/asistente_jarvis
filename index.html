<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Asistente IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=2">
    <link rel="preload" as="image" href="/static/jarvis_icono.jpg?v=1">
    <link rel="preload" as="image" href="/static/jarvis_voz.gif?v=1">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://unpkg.com/lucide@0.439.0/dist/umd/lucide.min.js"></script>
</head>
<body>

    <div class="sidebar-backdrop" id="backdrop" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <button class="new-chat-btn" onclick="createNewChat(true); closeSidebar();">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i> Nuevo Chat
        </button>
        <div style="font-size: 0.75rem; color: #60a5fa; font-weight: 600; padding-left: 4px; letter-spacing: 1px;">HISTORIAL</div>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="main-container">
        <header>
            <div class="brand">
                <button class="icon-btn menu-btn" onclick="toggleSidebar()" title="Menú">
                    <i data-lucide="menu" style="width: 22px; height: 22px;"></i>
                </button>
                <div class="brand-logo">
                    <div class="brand-logo-img"></div>
                </div>
                <span>Jarvis AI</span>
            </div>
            <div class="header-right">
                <button class="icon-btn header-btn" id="voiceBtn" onclick="toggleVoice()" title="Activar o silenciar la voz"></button>
                <div class="model-pill">
                    <i data-lucide="brain-circuit" style="width: 14px; height: 14px; color: #60a5fa;"></i>
                    <span id="modelName">Gemini</span>
                </div>
            </div>
        </header>

        <div class="chat-scroll" id="chatScroll"></div>

        <div class="input-container">
            <button class="mic-button" id="micBtn" onclick="toggleMic()" title="Hablar con Jarvis">
                <i data-lucide="mic" style="width: 18px; height: 18px;"></i>
            </button>
            <input type="text" id="userInput" placeholder="Habla con Jarvis..." onkeydown="handleKey(event)" autocomplete="off">
            <button class="send-button" id="sendBtn" onclick="sendMsg()" title="Enviar">
                <i data-lucide="arrow-up" style="width: 18px; height: 18px;"></i>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let chats = [];
        try { chats = JSON.parse(localStorage.getItem('jarvis_chats')) || []; } catch (e) { chats = []; }
        let currentChatId = localStorage.getItem('jarvis_current_id') || null;
        let busy = false;
        let voiceEnabled = localStorage.getItem('jarvis_voice') !== 'off';

        const GREETING = '¡Hola! 🖐️ Sistema Jarvis activado. Soy tu asistente virtual especializado en desarrollo web frontend. 🚀\n\nAntes de comenzar, dime: ¿cómo te llamas?';
        const MAX_CHATS = 50;
        const MAX_MSGS = 100;

        /* ---------------- Almacenamiento ---------------- */
        function persist() {
            try {
                localStorage.setItem('jarvis_chats', JSON.stringify(chats));
                localStorage.setItem('jarvis_current_id', currentChatId);
            } catch (e) { console.warn('No se pudo guardar en localStorage', e); }
        }

        /* ---------------- Chats ---------------- */
        function initApp() {
            if (chats.length === 0) {
                createNewChat(false); // sin voz: el navegador la bloquea antes del primer clic
            } else {
                if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                    currentChatId = chats[0].id;
                }
                loadChat(currentChatId);
            }
            updateVoiceIcon();
            setupMic();
            fetch('/config').then(r => r.json()).then(d => {
                document.getElementById('modelName').textContent = d.model;
            }).catch(() => {});
        }

        function createNewChat(speak) {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Nueva conversación',
                messages: [{ sender: 'ai', text: GREETING }]
            };
            chats.unshift(newChat);
            chats = chats.slice(0, MAX_CHATS);
            currentChatId = newChat.id;
            persist();
            loadChat(currentChatId);
            if (speak === true) speakText('Sistema Jarvis activado. ¿Cómo te llamas?');
        }

        function loadChat(id) {
            if (id !== currentChatId) stopSpeaking();
            currentChatId = id;
            persist();
            const chat = chats.find(c => c.id === id);
            if (!chat) return;

            const container = document.getElementById('chatScroll');
            container.innerHTML = '';
            chat.messages.forEach(msg => appendDOMMessage(msg.sender, msg.text));
            renderHistory();
        }

        function deleteChat(id) {
            if (!confirm('¿Eliminar esta conversación?')) return;
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) { createNewChat(false); return; }
            if (currentChatId === id) currentChatId = chats[0].id;
            persist();
            loadChat(currentChatId);
        }

        function renameChat(id) {
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            const nuevo = prompt('Nuevo nombre de la conversación:', chat.title);
            if (nuevo === null) return;
            const limpio = nuevo.trim().slice(0, 40);
            if (!limpio) return;
            chat.title = limpio;
            persist();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');

                const title = document.createElement('span');
                title.className = 'history-title';
                title.textContent = chat.title;

                const actions = document.createElement('div');
                actions.className = 'history-actions';

                const btnRename = document.createElement('button');
                btnRename.className = 'icon-btn';
                btnRename.title = 'Renombrar';
                btnRename.innerHTML = '<i data-lucide="pencil" style="width:14px;height:14px;"></i>';
                btnRename.onclick = (e) => { e.stopPropagation(); renameChat(chat.id); };

                const btnDelete = document.createElement('button');
                btnDelete.className = 'icon-btn danger';
                btnDelete.title = 'Eliminar';
                btnDelete.innerHTML = '<i data-lucide="trash-2" style="width:14px;height:14px;"></i>';
                btnDelete.onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };

                actions.appendChild(btnRename);
                actions.appendChild(btnDelete);
                item.appendChild(title);
                item.appendChild(actions);
                item.onclick = () => { loadChat(chat.id); closeSidebar(); };
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        function addMessage(chatId, sender, text) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            chat.messages.push({ sender, text });
            if (chat.messages.length > MAX_MSGS) chat.messages = chat.messages.slice(-MAX_MSGS);
            persist();
        }

        /* ---------------- Menú móvil ---------------- */
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('backdrop').classList.toggle('show');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('backdrop').classList.remove('show');
        }

        /* ---------------- Envío con streaming ---------------- */
        function setBusy(state) {
            busy = state;
            document.getElementById('userInput').disabled = state;
            document.getElementById('sendBtn').disabled = state;
            document.getElementById('micBtn').disabled = state;
            if (!state) document.getElementById('userInput').focus();
        }

        async function sendMsg() {
            if (busy) return;
            const input = document.getElementById('userInput');
            const txt = input.value.trim();
            if (!txt) return;

            const chatId = currentChatId;
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            // Historial previo (antes de añadir el mensaje nuevo)
            const historial = chat.messages.map(m => ({
                sender: m.sender,
                text: String(m.text).replace(/<[^>]*>/g, ' ')
            }));

            stopSpeaking();
            stopListening();

            input.value = '';
            addMessage(chatId, 'user', txt);
            appendDOMMessage('user', txt);

            setBusy(true);

            const { content } = createAIRow('...');
            content.classList.add('streaming');

            let acc = '';
            let spoken = 0;
            let gotFirst = false;
            let streamError = null;
            let renderTimer = null;

            const slowTimer = setTimeout(() => {
                if (!gotFirst) content.textContent = 'Reconectando con el servidor…';
            }, 6000);

            const render = () => {
                renderTimer = null;
                content.innerHTML = DOMPurify.sanitize(marked.parse(acc));
                scrollDown(false);
            };
            const queueRender = () => { if (!renderTimer) renderTimer = setTimeout(render, 50); };

            // Habla por frases mientras el texto va llegando
            const speakPending = (final) => {
                if (!voiceEnabled || currentChatId !== chatId) return;
                const pending = acc.slice(spoken);
                let end = -1;
                if (final) {
                    end = pending.length;
                } else {
                    const re = /[.!?…:;]\s|\n/g;
                    let m;
                    while ((m = re.exec(pending)) !== null) end = m.index + m[0].length;
                    if (end < 30) return;
                }
                if (end <= 0) return;
                const segEnd = spoken + end;
                const fences = (acc.slice(0, segEnd).match(/```/g) || []).length;
                if (!final && fences % 2 === 1) return; // no cortar un bloque de código
                speakChunk(acc.slice(spoken, segEnd));
                spoken = segEnd;
            };

            const showError = (msg) => {
                content.innerHTML = '⚠️ <strong>Error:</strong> ' + escapeHtml(msg);
            };

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: txt, historial })
                });

                if (!res.ok) {
                    let msg = 'Fallo en el servidor';
                    try { const d = await res.json(); msg = d.error || msg; } catch (e) {}
                    throw new Error(msg);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) !== -1) {
                        const raw = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        if (!raw.startsWith('data: ')) continue;

                        let evt;
                        try { evt = JSON.parse(raw.slice(6)); } catch (e) { continue; }

                        if (evt.t) {
                            gotFirst = true;
                            acc += evt.t;
                            queueRender();
                            speakPending(false);
                        } else if (evt.error) {
                            streamError = evt.error;
                        }
                    }
                }

                clearTimeout(slowTimer);
                if (renderTimer) clearTimeout(renderTimer);
                content.classList.remove('streaming');

                if (acc.trim()) {
                    render();
                    addMessage(chatId, 'ai', acc);
                    speakPending(true);
                    if (streamError) content.insertAdjacentHTML('beforeend', '<p>⚠️ ' + escapeHtml(streamError) + '</p>');

                    if (chat.title === 'Nueva conversación') {
                        chat.title = txt.length > 25 ? txt.substring(0, 25) + '...' : txt;
                        persist();
                        renderHistory();
                    }
                } else {
                    showError(streamError || 'No se recibió respuesta.');
                }
            } catch (e) {
                clearTimeout(slowTimer);
                if (renderTimer) clearTimeout(renderTimer);
                content.classList.remove('streaming');
                if (acc.trim()) {
                    render();
                    addMessage(chatId, 'ai', acc);
                } else {
                    showError(e.message && e.message !== 'Failed to fetch' ? e.message : 'Error de red con el servidor.');
                }
            } finally {
                setBusy(false);
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMsg();
        }

        /* ---------------- Voz: síntesis ---------------- */
        let speechGen = 0;
        let speechPending = 0;

        function cleanForSpeech(text) {
            return String(text)
                .replace(/```[\s\S]*?```/g, ' bloque de código. ')
                .replace(/```[\s\S]*$/, ' ')
                .replace(/<[^>]*>/g, ' ')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
                .replace(/[*#_`>~]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function speakChunk(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            const clean = cleanForSpeech(text);
            if (!clean) return;

            const gen = speechGen;
            const u = new SpeechSynthesisUtterance(clean);
            u.lang = 'es-ES';
            u.rate = 1.0;
            u.pitch = 0.9;

            speechPending++;
            u.onstart = () => { if (gen === speechGen) document.body.classList.add('speaking'); };
            const finish = () => {
                if (gen !== speechGen) return;
                speechPending = Math.max(0, speechPending - 1);
                if (speechPending === 0) document.body.classList.remove('speaking');
            };
            u.onend = finish;
            u.onerror = finish;

            window.speechSynthesis.speak(u);
        }

        function speakText(text) {
            stopSpeaking();
            speakChunk(text);
        }

        function stopSpeaking() {
            speechGen++;
            speechPending = 0;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.body.classList.remove('speaking');
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            localStorage.setItem('jarvis_voice', voiceEnabled ? 'on' : 'off');
            if (!voiceEnabled) stopSpeaking();
            updateVoiceIcon();
        }

        function updateVoiceIcon() {
            const btn = document.getElementById('voiceBtn');
            btn.innerHTML = '<i data-lucide="' + (voiceEnabled ? 'volume-2' : 'volume-x') + '" style="width:18px;height:18px;"></i>';
            btn.classList.toggle('muted', !voiceEnabled);
            lucide.createIcons();
        }

        /* ---------------- Voz: micrófono ---------------- */
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let listening = false;

        function setupMic() {
            const btn = document.getElementById('micBtn');
            const input = document.getElementById('userInput');
            if (!SR) { btn.style.display = 'none'; return; } // p. ej. Firefox

            recognition = new SR();
            recognition.lang = 'es-ES';
            recognition.interimResults = true;
            recognition.continuous = false;

            recognition.onstart = () => {
                listening = true;
                btn.classList.add('listening');
                input.placeholder = 'Escuchando...';
            };
            recognition.onresult = (e) => {
                let finalText = '', interim = '';
                for (let i = 0; i < e.results.length; i++) {
                    const r = e.results[i];
                    if (r.isFinal) finalText += r[0].transcript;
                    else interim += r[0].transcript;
                }
                input.value = (finalText + interim).trim();
            };
            recognition.onerror = (e) => {
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    alert('Permite el acceso al micrófono en tu navegador para hablar con Jarvis.');
                }
            };
            recognition.onend = () => {
                listening = false;
                btn.classList.remove('listening');
                input.placeholder = 'Habla con Jarvis...';
                if (input.value.trim() && !busy) sendMsg(); // envía lo que dijiste
            };
        }

        function toggleMic() {
            if (!recognition || busy) return;
            if (listening) {
                recognition.stop();
            } else {
                stopSpeaking(); // para que Jarvis no se escuche a sí mismo
                document.getElementById('userInput').value = '';
                try { recognition.start(); } catch (e) {}
            }
        }

        function stopListening() {
            if (recognition && listening) { try { recognition.stop(); } catch (e) {} }
        }

        /* ---------------- DOM ---------------- */
        function scrollDown(force) {
            const c = document.getElementById('chatScroll');
            if (force || c.scrollHeight - c.scrollTop - c.clientHeight < 150) c.scrollTop = c.scrollHeight;
        }

        function createAIRow(html) {
            const container = document.getElementById('chatScroll');
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.innerHTML = '<div class="avatar"><div class="ai-avatar-img"></div></div><div class="message-content"></div>';
            const content = row.querySelector('.message-content');
            content.innerHTML = html || '';
            container.appendChild(row);
            scrollDown(true);
            return { row, content };
        }

        function appendDOMMessage(sender, text) {
            if (sender === 'ai') {
                createAIRow(DOMPurify.sanitize(marked.parse(String(text))));
                return;
            }
            const container = document.getElementById('chatScroll');
            const row = document.createElement('div');
            row.className = 'message-row user';
            row.innerHTML =
                '<div class="avatar"><i data-lucide="user" style="width: 18px; height: 18px;"></i></div>' +
                '<div class="message-content">' + escapeHtml(String(text)) + '</div>';
            container.appendChild(row);
            lucide.createIcons();
            scrollDown(true);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        window.onload = initApp;
    </script>
</body>
</html>
