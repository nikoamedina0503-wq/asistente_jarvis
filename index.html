<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Jarvis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --gemini-bg: #131314;
            --gemini-surface: #1e1f20;
            --gemini-surface-hover: #282a2c;
            --gemini-user-bubble: #2b2c2f;
            --gemini-text: #e3e3e3;
            --gemini-text-secondary: #c4c7c5;
            --gemini-border: #333537;
            --gemini-gradient: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--gemini-bg);
            color: var(--gemini-text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--gemini-text);
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--gemini-border);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .model-pill {
            font-size: 0.8rem;
            color: var(--gemini-text-secondary);
            background: var(--gemini-surface);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--gemini-border);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 120px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: var(--gemini-border);
            border-radius: 10px;
        }

        .message-row {
            display: flex;
            gap: 16px;
            max-width: 85%;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.ai {
            align-self: flex-start;
            max-width: 90%;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.85rem;
            overflow: hidden;
        }

        .user .avatar {
            background: #3b82f6;
            color: white;
        }

        .ai .avatar {
            background: var(--gemini-surface);
            color: #8ab4f8;
            border: 1px solid var(--gemini-border);
        }

        .ai .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-content {
            padding: 4px 0;
            line-height: 1.6;
            font-size: 0.95rem;
            color: var(--gemini-text);
        }

        .user .message-content {
            background: var(--gemini-user-bubble);
            padding: 12px 18px;
            border-radius: 20px;
            border-bottom-right-radius: 4px;
        }

        .ai .message-content p { margin-bottom: 12px; }
        .ai .message-content p:last-child { margin-bottom: 0; }
        .ai .message-content h1, .ai .message-content h2, .ai .message-content h3 {
            margin: 16px 0 8px 0;
            color: #fff;
            font-weight: 600;
        }
        .ai .message-content ul {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        pre {
            background: #1a1a1c;
            border: 1px solid var(--gemini-border);
            border-radius: 12px;
            margin: 12px 0;
            position: relative;
            overflow: hidden;
        }

        code {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }

        :not(pre) > code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            color: #8ab4f8;
        }

        pre code {
            display: block;
            padding: 16px;
            overflow-x: auto;
            color: #e3e3e3;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--gemini-surface);
            border: 1px solid var(--gemini-border);
            color: var(--gemini-text-secondary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: var(--gemini-surface-hover);
            color: white;
        }

        .input-container {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: var(--gemini-surface);
            border: 1px solid var(--gemini-border);
            border-radius: 32px;
            padding: 10px 14px 10px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: border-color 0.2s;
        }

        .input-container:focus-within {
            border-color: #8ab4f8;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--gemini-text);
            font-size: 0.95rem;
        }

        input::placeholder {
            color: var(--gemini-text-secondary);
        }

        .send-button {
            background: var(--gemini-gradient);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .send-button:active {
            transform: scale(0.92);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 6px 0;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #8ab4f8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
