        /* ---------------- Chats ---------------- */
        function createNewChat(speak) {
            const newChat = { id: 'chat_' + Date.now(), title: 'Nueva conversación', messages: [{ sender: 'ai', text: GREETING }] };
            chats.unshift(newChat);
            chats = chats.slice(0, MAX_CHATS);
            currentChatId = newChat.id;

            loadChat(currentChatId);
            if (speak === true) speakText('Hola, soy Jarvis. ¿Cómo te llamas?');

        function loadChat(id) {
            if (id !== currentChatId) stopSpeaking();
            currentChatId = id;
            persist();
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            const container = $('chatScroll');
            container.innerHTML = '';
            chat.messages.forEach(msg => appendDOMMessage(msg.sender, msg.text, imageExtra(id, msg)));
            renderHistory();

        function imageExtra(chatId, msg) {
            if (!msg.imgs) return null;
            const ref = chatImages[chatId];
            if (ref && ref.msg === msg) return { urls: ref.images.map(i => i.url) };
            return { count: msg.imgs };
        }

        function deleteChat(id) {
            if (!confirm('¿Eliminar esta conversación?')) return;
            chats = chats.filter(c => c.id !== id);
            delete chatImages[id];
            if (chats.length === 0) { createNewChat(false); return; }
            if (currentChatId === id) currentChatId = chats[0].id;
            persist();
            loadChat(currentChatId);

        /* ---------------- Fotos ---------------- */
        async function addFiles(fileList) {
            const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/'));
            for (const f of files) {
                if (pendingImages.length >= MAX_IMAGES) { alert('Puedes enviar hasta ' + MAX_IMAGES + ' fotos por mensaje.'); break; }
                try { pendingImages.push(await compressImage(f)); }
                catch (e) { alert('No pude leer la imagen "' + f.name + '". Prueba con una foto JPG o PNG.'); }
            }
            renderAttachPreview();
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const MAX = 1800;
                    let w = img.naturalWidth, h = img.naturalHeight;
                    const scale = Math.min(1, MAX / Math.max(w, h));
                    w = Math.round(w * scale); h = Math.round(h * scale);
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    URL.revokeObjectURL(url);
                    resolve({ mime: 'image/jpeg', data: dataUrl.split(',')[1], url: dataUrl });
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagen no válida')); };
                img.src = url;
            });
        }

                x.textContent = '×';
                x.title = 'Quitar';
                x.onclick = () => { pendingImages.splice(i, 1); renderAttachPreview(); };
                wrap.appendChild(el);
                wrap.appendChild(x);

            });
        }

        function setBusy(state) {
            busy = state;

        async function sendMsg(opts) {
            if (busy) return;
            const forceGoogle = !!(opts && opts.forceGoogle);
            const input = $('userInput');
            const txt = input.value.trim();
            if (!txt && pendingImages.length === 0) return;

            const chatId = currentChatId;
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            // Historial previo; se reenvía la última foto mientras siga en la ventana de contexto
            const ref = chatImages[chatId];
            const startIdx = Math.max(0, chat.messages.length - 12);
            const historial = chat.messages.map((m, i) => {
                const item = { sender: m.sender, text: String(m.text || '').replace(/<[^>]*>/g, ' ') + (m.imgs ? ' [imagen adjunta]' : '') };
                if (ref && ref.msg === m && i >= startIdx) item.imagenes = ref.images.map(({ mime, data }) => ({ mime, data }));
                return item;
            });

            const imagenes = pendingImages.map(({ mime, data }) => ({ mime, data }));
            const sentImages = pendingImages.slice();

            stopSpeaking();
            stopPushRecognition();
            clearAwait();

            input.value = '';
            pendingImages = [];
            renderAttachPreview();

            const userMsg = addMessage(chatId, 'user', txt, sentImages.length ? { imgs: sentImages.length } : null);
            if (sentImages.length && userMsg) chatImages[chatId] = { msg: userMsg, images: sentImages };
            appendDOMMessage('user', txt, sentImages.length ? { urls: sentImages.map(i => i.url) } : null);

            setBusy(true);

            const { content } = createAIRow('...');
            content.classList.add('streaming');

            let acc = '', spoken = 0, gotFirst = false, streamError = null, renderTimer = null;

            const slowTimer = setTimeout(() => {
                if (!gotFirst) content.textContent = 'Reconectando con el servidor…';
            }, 7000);

            const render = () => { renderTimer = null; content.innerHTML = renderMarkdown(acc); scrollDown(false); };
            const queueRender = () => { if (!renderTimer) renderTimer = setTimeout(render, 50); };

            // Habla por frases mientras el texto va llegando
            const speakPending = (final) => {
                if (!voiceEnabled || currentChatId !== chatId) return;
                if (spoken >= MAX_SPOKEN) return;
                const pending = acc.slice(spoken);
                let end = -1;
                if (final) {
                    end = Math.min(pending.length, 600);
                } else {
                    const re = /[.!?…:;]\s|\n/g;
                    let m;
                    while ((m = re.exec(pending)) !== null) end = m.index + m[0].length;
                    if (end < (voiceMode === 'gemini' ? 120 : 30)) return;
                }
                if (end <= 0) return;
                const segEnd = spoken + end;
                const fences = (acc.slice(0, segEnd).match(/```/g) || []).length;
                if (!final && fences % 2 === 1) return; // no cortar un bloque de código
                speakChunk(acc.slice(spoken, segEnd));
                spoken = segEnd;
            };

            const showError = (msg) => { content.innerHTML = '⚠️ <strong>Error:</strong> ' + escapeHtml(msg); };

            try {
                // Hasta 3 intentos: en el plan gratis de Render el servidor tarda en despertar
                const payload = JSON.stringify({ mensaje: txt, historial, imagenes, usar_google: forceGoogle });
                let res = null, netErr = null;
                for (let attempt = 0; attempt < 3 && !res; attempt++) {
                    try {
                        res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload });
                    } catch (e) {
                        netErr = e;
                        if (attempt < 2) {
                            content.textContent = 'Reconectando con el servidor…';
                            await new Promise(r => setTimeout(r, 3500 * (attempt + 1)));
                        }
                    }
                }
                if (!res) throw netErr;

                if (!res.ok) {
                    let msg = 'Fallo en el servidor';
                    try { const d = await res.json(); msg = d.error || msg; } catch (e) {}
                    throw new Error(msg);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) !== -1) {
                        const raw = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        if (!raw.startsWith('data: ')) continue;

                        let evt;
                        try { evt = JSON.parse(raw.slice(6)); } catch (e) { continue; }

                        if (evt.t) {
                            gotFirst = true;
                            acc += evt.t;
                            queueRender();
                            speakPending(false);
                        } else if (evt.info) {
                            if (!gotFirst) content.textContent = evt.info;
                        } else if (evt.google_expired) {
                            google.connected = false; renderGoogle();
                        } else if (evt.error) {
                            streamError = evt.error;
                        }
                    }
                }

                clearTimeout(slowTimer);
                if (renderTimer) clearTimeout(renderTimer);
                content.classList.remove('streaming');

                if (acc.trim()) {
                    render();
                    addMessage(chatId, 'ai', acc);
                    speakPending(true);
                    if (streamError) content.insertAdjacentHTML('beforeend', '<p>⚠️ ' + escapeHtml(streamError) + '</p>');
                    if (chat.title === 'Nueva conversación') {
                        const base = txt || 'Foto adjunta';
                        chat.title = base.length > 25 ? base.substring(0, 25) + '...' : base;
                        persist();
                        renderHistory();
                    }
                } else {
                    showError(streamError || 'No se recibió respuesta.');
                }
            } catch (e) {
                clearTimeout(slowTimer);
                if (renderTimer) clearTimeout(renderTimer);
                content.classList.remove('streaming');
                if (acc.trim()) { render(); addMessage(chatId, 'ai', acc); }
                else showError(e instanceof TypeError
                    ? 'No pude conectar con el servidor. Puede estar despertando o reiniciándose: espera un minuto y vuelve a intentarlo.'
                    : (e.message || 'Error de red con el servidor.'));
            } finally {
                setBusy(false);
            }
        }

        /* ---------------- Texto: Markdown + fórmulas ---------------- */
        function renderMarkdown(text) {
            const maths = [];
            const stash = (expr, display) => { maths.push({ expr, display }); return 'ZZMATH' + (maths.length - 1) + 'ZZ'; };

            // Las fórmulas se apartan antes de pasar por Markdown (para que no las dañe), pero sin tocar el código
            const parts = String(text).split(/(```[\s\S]*?```|`[^`\n]*`)/g);
            const prepared = parts.map((p, i) => {
                if (i % 2 === 1) return p; // bloque de código: se deja igual
                return p
                    .replace(/\$\$([\s\S]+?)\$\$/g, (m, e) => stash(e, true))
                    .replace(/\\\[([\s\S]+?)\\\]/g, (m, e) => stash(e, true))
                    .replace(/\\\(([\s\S]+?)\\\)/g, (m, e) => stash(e, false))
                    .replace(/(^|[^\\$\w])\$([^\s$](?:[^$\n]*[^\s$])?)\$(?![\w$])/g, (m, pre, e) => pre + stash(e, false));
            }).join('');

            let html = marked.parse(prepared);
            html = html.replace(/ZZMATH(\d+)ZZ/g, (m, n) => {
                const item = maths[Number(n)];
                if (!item) return m;
                try {
                    if (typeof katex === 'undefined') throw new Error('sin katex');
                    return katex.renderToString(item.expr, { displayMode: item.display, throwOnError: false, output: 'html' });
                } catch (e) {
                    return '<code>' + String(item.expr).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</code>';
                }
            });
            return DOMPurify.sanitize(html);
        }

        /* ---------------- Texto para la voz ---------------- */
        function mathToSpeech(e) {
            return String(e)
                .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, ' $1 sobre $2 ')
                .replace(/\\sqrt\{([^{}]*)\}/g, ' raíz de $1 ')
                .replace(/\^\{?2\}?/g, ' al cuadrado ')
                .replace(/\^\{?3\}?/g, ' al cubo ')
                .replace(/\^\{([^{}]*)\}/g, ' elevado a $1 ')
                .replace(/\^(\w)/g, ' elevado a $1 ')
                .replace(/\\(cdot|times)/g, ' por ')
                .replace(/\\div/g, ' entre ')
                .replace(/\\pm/g, ' más menos ')
                .replace(/\\(leq|le)\b/g, ' menor o igual que ')
                .replace(/\\(geq|ge)\b/g, ' mayor o igual que ')
                .replace(/\\neq/g, ' distinto de ')
                .replace(/\\pi/g, ' pi ')
                .replace(/\\[a-zA-Z]+/g, ' ')
                .replace(/[{}]/g, '')
                .replace(/=/g, ' igual a ')
                .replace(/\+/g, ' más ')
                .replace(/\s+/g, ' ');
        }

        function cleanForSpeech(text) {
            return String(text)
                .replace(/```[\s\S]*?```/g, ' bloque de código. ')
                .replace(/```[\s\S]*$/, ' ')
                .replace(/\$\$[\s\S]*?\$\$/g, ' fórmula en pantalla. ')
                .replace(/\\\[[\s\S]*?\\\]/g, ' fórmula en pantalla. ')
                .replace(/\\\(([\s\S]*?)\\\)/g, (m, e) => mathToSpeech(e))
                .replace(/(^|[^\\$\w])\$([^\s$](?:[^$\n]*[^\s$])?)\$(?![\w$])/g, (m, pre, e) => pre + mathToSpeech(e))
                .replace(/<[^>]*>/g, ' ')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
                .replace(/[*#_`>~|]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function splitForTts(text, max) {
            const out = [];
            let rest = text;
            while (rest.length > max) {
                let cut = Math.max(rest.lastIndexOf('. ', max), rest.lastIndexOf('? ', max), rest.lastIndexOf('! ', max));
                if (cut < max * 0.4) cut = rest.lastIndexOf(' ', max);
                if (cut <= 0) cut = max;
                out.push(rest.slice(0, cut + 1).trim());
                rest = rest.slice(cut + 1);
            }
            if (rest.trim()) out.push(rest.trim());
            return out;
        }

        /* ---------------- Comandos de voz y palabra de activación ---------------- */
        const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const WAKE_RE = /(?:\b(?:o\s?k|okay|okey|oquei|oye|hey|ey|hola)\s+)?\b(?:jarvis|yarvis|jarvi|harvis|yarbis|charvis|jarbis|garvis|jarvys|yarvi|jarvez)\b[\s,.:;!¡¿?\-]*/;
        const STOP_RE = /\b(para|detente|callate|silencio|basta|cancela|alto)\b/;

        // Devuelve true si la frase era una orden local (no hace falta preguntarle a la IA)
        function matchLocalCommand(raw) {
            const t = norm(raw).replace(/[.,;:!¡¿?]/g, '').trim();
            if (/^(para|detente|callate|silencio|basta|cancela|alto)\b/.test(t)) return 'stop';
            if (/^((abre|crea|inicia|empieza|haz|hazme) )?(un |una )?(nuevo chat|nueva conversacion|chat nuevo)|^(empieza|empecemos) de nuevo/.test(t)) return 'newchat';
            if (/^(silenciate|silencia|apaga la voz|desactiva la voz|apaga el sonido)/.test(t)) return 'mute';
            if (/^(activa la voz|enciende la voz|prende la voz)/.test(t)) return 'unmute';
            if (/^(desactiva|apaga|termina|sal del) (el )?modo manos libres/.test(t)) return 'handsoff';
            return null;
        }
        /* END-PURE */

        /* ---------------- Voz: síntesis ---------------- */
        let speechGen = 0;          // se incrementa cada vez que se corta la voz
        let browserPending = 0;
        let audioQueue = [];
        let audioPlaying = false;
        let currentAudio = null, currentResolve = null, currentUrl = null;
        let ttsAbort = new AbortController();

        function scoreVoice(v) {
            const n = v.name.toLowerCase();
            let s = 0;
            if (/natural|neural/.test(n)) s += 100;
            if (/premium|enhanced|mejorada/.test(n)) s += 60;
            if (/online/.test(n)) s += 40;
            if (/google/.test(n)) s += 30;
            if (v.localService === false) s += 10;
            if (/^es[-_](co|mx|us|419|ar)/i.test(v.lang)) s += 15;
            else if (/^es[-_]es/i.test(v.lang)) s += 5;
            return s;
        }

        function spanishVoices() {
            if (!('speechSynthesis' in window)) return [];
            return window.speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang)).sort((a, b) => scoreVoice(b) - scoreVoice(a));
        }

        function pickBrowserVoice() {
            const vs = spanishVoices();
            if (!vs.length) return null;
            if (browserVoiceURI) { const f = vs.find(v => v.voiceURI === browserVoiceURI); if (f) return f; }
            return vs[0];
        }

        function buildVoiceSelect() {
            const sel = $('voiceSelect');
            if (!sel) return;
            sel.innerHTML = '';

            if (ttsAvailable) {
                const mk = (label, list) => {
                    const g = document.createElement('optgroup');
                    g.label = label;
                    list.forEach(([name, desc]) => {
                        const o = document.createElement('option');
                        o.value = 'g:' + name;
                        o.textContent = name + ' · ' + desc;
                        g.appendChild(o);
                    });
                    sel.appendChild(g);
                };
                mk('✨ Voces realistas · recomendadas', GEMINI_VOICES.slice(0, 6));
                mk('✨ Voces realistas · más opciones', GEMINI_VOICES.slice(6));
            }

            const b = document.createElement('optgroup');
            b.label = 'Voces de tu dispositivo';
            const auto = document.createElement('option');
            auto.value = 'b:';
            auto.textContent = 'Automática (la mejor disponible)';
            b.appendChild(auto);
            spanishVoices().forEach(v => {
                const o = document.createElement('option');
                o.value = 'b:' + v.voiceURI;
                o.textContent = v.name + ' (' + v.lang + ')';
                b.appendChild(o);
            });
            sel.appendChild(b);

            sel.value = (voiceMode === 'gemini' && ttsAvailable) ? 'g:' + geminiVoice : 'b:' + browserVoiceURI;
            if (!sel.value) sel.selectedIndex = 0;
        }

        function changeVoice(val) {
            if (val.startsWith('g:')) {
                voiceMode = 'gemini';
                geminiVoice = val.slice(2);
                localStorage.setItem('jarvis_gemini_voice', geminiVoice);
            } else {
                voiceMode = 'browser';
                browserVoiceURI = val.slice(2);
                localStorage.setItem('jarvis_browser_voice', browserVoiceURI);
            }
            localStorage.setItem('jarvis_voice_mode', voiceMode);
            ttsFails = 0;
            if (!voiceEnabled) { voiceEnabled = true; localStorage.setItem('jarvis_voice', 'on'); updateVoiceIcon(); }
            speakText('Hola, soy Jarvis. ¿Te gusta cómo suena mi voz?');
        }

        function browserSpeak(text, gen) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) { resolve(); return; }
                const u = new SpeechSynthesisUtterance(text);
                const v = pickBrowserVoice();
                if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'es-ES'; }
                u.rate = 1.0;
                u.pitch = 1.0;
                browserPending++;
                u.onstart = () => { if (gen === speechGen) document.body.classList.add('speaking'); };
                const fin = () => {
                    if (gen === speechGen) {
                        browserPending = Math.max(0, browserPending - 1);
                        if (browserPending === 0 && !audioPlaying) document.body.classList.remove('speaking');
                    }
                    resolve();
                };
                u.onend = fin;
                u.onerror = fin;
                window.speechSynthesis.speak(u);
            });
        }

        function enqueueGemini(text) {
            const gen = speechGen;
            const p = fetch('/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: text, voz: geminiVoice }),
                signal: ttsAbort.signal
            }).then(r => { if (!r.ok) throw new Error('tts ' + r.status); return r.blob(); })
              .then(b => URL.createObjectURL(b));
            p.catch(() => {});
            audioQueue.push({ p, gen, text });
            if (!audioPlaying) playLoop();
        }

        function playUrl(url, gen) {
            return new Promise((resolve) => {
                const a = new Audio(url);
                currentAudio = a; currentResolve = resolve; currentUrl = url;
                const done = (ok) => {
                    if (currentAudio === a) { currentAudio = null; currentResolve = null; currentUrl = null; }
                    URL.revokeObjectURL(url);
                    resolve(ok);
                };
                a.onended = () => done(true);
                a.onerror = () => done(false);
                if (gen === speechGen) document.body.classList.add('speaking');
                a.play().catch(() => done(false));
            });
        }

        async function playLoop() {
            audioPlaying = true;
            while (audioQueue.length) {
                const item = audioQueue.shift();
                if (item.gen !== speechGen) { item.p.then(u => URL.revokeObjectURL(u)).catch(() => {}); continue; }
                let ok = false;
                try {
                    const url = await item.p;
                    if (item.gen !== speechGen) { URL.revokeObjectURL(url); continue; }
                    ok = await playUrl(url, item.gen);
                } catch (e) { ok = false; }
                if (item.gen !== speechGen) continue;

                if (ok) { ttsFails = 0; }
                else {
                    // La voz realista falló: usa la voz del dispositivo para esta frase
                    ttsFails++;
                    if (ttsFails >= 2) voiceMode = 'browser';
                    await browserSpeak(item.text, item.gen);
                }
            }
            audioPlaying = false;
            if (browserPending === 0) document.body.classList.remove('speaking');
        }

        function speakChunk(text) {
            if (!voiceEnabled) return;
            const clean = cleanForSpeech(text);
            if (!clean) return;
            if (voiceMode === 'gemini' && ttsAvailable) splitForTts(clean, 500).forEach(enqueueGemini);
            else if ('speechSynthesis' in window) browserSpeak(clean, speechGen);
        }

        function speakText(text) { stopSpeaking(); speakChunk(text); }

        function stopSpeaking() {
            speechGen++;
            browserPending = 0;
            audioQueue.forEach(it => it.p.then(u => URL.revokeObjectURL(u)).catch(() => {}));
            audioQueue = [];
            try { ttsAbort.abort(); } catch (e) {}
            ttsAbort = new AbortController();
            if (currentAudio) {
                const a = currentAudio, r = currentResolve, u = currentUrl;
                currentAudio = null; currentResolve = null; currentUrl = null;
                a.pause();
                if (u) URL.revokeObjectURL(u);
                if (r) r(true);
            }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.body.classList.remove('speaking');
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            localStorage.setItem('jarvis_voice', voiceEnabled ? 'on' : 'off');
            if (!voiceEnabled) stopSpeaking();
            updateVoiceIcon();
        }

        function updateVoiceIcon() {
            const btn = $('voiceBtn');
            btn.innerHTML = '<i data-lucide="' + (voiceEnabled ? 'volume-2' : 'volume-x') + '" style="width:18px;height:18px;"></i>';
            btn.classList.toggle('muted', !voiceEnabled);
            lucide.createIcons();
        }

        /* ---------------- Estado visual ---------------- */
        function setStatus() {
            let state = 'idle', label = 'EN LÍNEA';
            const speaking = document.body.classList.contains('speaking');
            if (busy) { state = 'thinking'; label = 'PROCESANDO'; }
            else if (speaking) { state = 'speaking'; label = 'HABLANDO'; }
            else if (recMode === 'push' || awaitingCommand) { state = 'listening'; label = 'ESCUCHANDO'; }
            else if (handsFree && recMode === 'wake') { state = 'armed'; label = 'DI «OKEY JARVIS»'; }
            document.body.dataset.state = state;
            $('statusText').textContent = label;
        }

        function setupMicObserver() {
            // Cada vez que cambia la clase "speaking" del body, se actualiza el estado
            new MutationObserver(setStatus).observe(document.body, { attributes: true, attributeFilter: ['class'] });
            // Marca la última vez que Jarvis habló, para no escucharse a sí mismo
            setInterval(() => { if (document.body.classList.contains('speaking')) lastSpeakTs = Date.now(); }, 250);
        }

        /* ---------------- Micrófono y modo manos libres ---------------- */
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let recMode = 'idle';   // 'idle' | 'push' | 'wake'
        let handsFree = localStorage.getItem('jarvis_handsfree') === 'on';
        let awaitingCommand = false, awaitTimer = null, wakeTimer = null, lastSpeakTs = 0, wakeErrors = 0;
        let audioCtx = null;

        function chime(freqs) {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                const t0 = audioCtx.currentTime;
                (freqs || [660, 990]).forEach((f, i) => {
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    const t = t0 + i * 0.12;
                    o.type = 'sine'; o.frequency.value = f;
                    g.gain.setValueAtTime(0.0001, t);
                    g.gain.exponentialRampToValueAtTime(0.15, t + 0.03);
                    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(t); o.stop(t + 0.3);
                });
            } catch (e) {}
        }

        function clearAwait() {
            awaitingCommand = false;
            clearTimeout(awaitTimer);
            if (recMode !== 'push') $('userInput').placeholder = PLACEHOLDER;
            setStatus();
        }

        function startRecognition(mode, silent) {
            if (!SR) return;
            stopRecognition();
            const r = new SR();
            r.lang = 'es-ES';
            r.interimResults = true;
            r.continuous = (mode === 'wake');
            r.maxAlternatives = 1;
            recognition = r;
            recMode = mode;
            const input = $('userInput');

            r.onstart = () => {
                if (r !== recognition) return;
                if (mode === 'push') { $('micBtn').classList.add('listening'); input.placeholder = 'Escuchando...'; }
                setStatus();
            };
            r.onresult = (e) => {
                if (r !== recognition) return;
                if (mode === 'push') {
                    let finalText = '', interim = '';
                    for (let i = 0; i < e.results.length; i++) {
                        const res = e.results[i];
                        if (res.isFinal) finalText += res[0].transcript; else interim += res[0].transcript;
                    }
                    input.value = (finalText + interim).trim();
                } else {
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        if (e.results[i].isFinal) handleWake(e.results[i][0].transcript);
                    }
                }
            };
            r.onerror = (e) => {
                if (r !== recognition) return;
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    handsFree = false;
                    localStorage.setItem('jarvis_handsfree', 'off');
                    recognition = null; recMode = 'idle';
                    $('micBtn').classList.remove('listening');
                    updateHandsUI(); setStatus();
                    if (!silent) alert('Permite el acceso al micrófono en tu navegador para usar la voz.');
                } else if (e.error === 'audio-capture') {
                    if (!silent) alert('No encuentro ningún micrófono conectado.');
                } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
                    wakeErrors++;
                }
            };
            r.onend = () => {
                if (r !== recognition) return;
                recognition = null;
                recMode = 'idle';
                $('micBtn').classList.remove('listening');
                if (!awaitingCommand) input.placeholder = PLACEHOLDER;
                if (mode === 'push' && input.value.trim() && !busy) {
                    const wm = WAKE_RE.exec(norm(input.value));
                    if (wm && wm.index === 0) input.value = input.value.slice(wm[0].length).trim();  // quita «Okey Jarvis»
                    if (input.value.trim().length > 1) sendMsg();                                    // envía lo que dijiste
                    else input.value = '';
                }
                if (handsFree) scheduleWake(mode === 'push' ? 900 : (wakeErrors > 3 ? 3000 : 300));
                setStatus();
            };
            try { r.start(); } catch (e) {}
        }

        function stopRecognition() {
            if (recognition) { const r = recognition; recognition = null; try { r.abort(); } catch (e) {} }
            recMode = 'idle';
            $('micBtn').classList.remove('listening');
            if (!awaitingCommand) $('userInput').placeholder = PLACEHOLDER;
        }

        function stopPushRecognition() { if (recMode === 'push') stopRecognition(); }

        function scheduleWake(ms) {
            clearTimeout(wakeTimer);
            wakeTimer = setTimeout(() => {
                if (handsFree && recMode === 'idle') startRecognition('wake', true);
            }, ms);
        }

        function handleWake(text) {
            const t = norm(text);
            const speakingNow = document.body.classList.contains('speaking') || (Date.now() - lastSpeakTs < 1500);

            // Mientras Jarvis habla solo se aceptan órdenes de parada ("Jarvis, para")
            if (speakingNow) {
                if (WAKE_RE.test(t) && STOP_RE.test(t)) { stopSpeaking(); chime([880]); }
                return;
            }
            if (busy) return;

            if (awaitingCommand) {
                clearAwait();
                if (text.trim().length > 1) runVoiceCommand(text.trim());
                return;
            }

            const m = WAKE_RE.exec(t);
            if (!m) return;
            const rest = text.slice(m.index + m[0].length).trim();
            if (rest.length > 2) {
                runVoiceCommand(rest);
            } else {
                // Solo dijo "Okey Jarvis": suena un aviso y se queda esperando la orden
                awaitingCommand = true;
                chime([660, 990]);
                $('userInput').placeholder = 'Te escucho…';
                clearTimeout(awaitTimer);
                awaitTimer = setTimeout(clearAwait, 8000);
                setStatus();
            }
        }

        function runVoiceCommand(cmd) {
            const local = matchLocalCommand(cmd);
            if (local) {
                chime([990]);
                if (local === 'stop') stopSpeaking();
                else if (local === 'newchat') createNewChat(false);
                else if (local === 'mute') { if (voiceEnabled) toggleVoice(); }
                else if (local === 'unmute') { if (!voiceEnabled) toggleVoice(); }
                else if (local === 'handsoff') setHandsFree(false, true);
                return;
            }
            $('userInput').value = cmd;
            sendMsg();
        }

        function updateHandsUI() {
            const b = $('handsBtn');
            b.classList.toggle('active', handsFree);
            b.title = handsFree ? 'Manos libres ACTIVADO: di «Okey Jarvis». Clic para desactivar'
                                : 'Activar modo manos libres: di «Okey Jarvis»';
        }

        function setHandsFree(on, silent) {
            handsFree = on;
            localStorage.setItem('jarvis_handsfree', on ? 'on' : 'off');
            updateHandsUI();
            clearTimeout(wakeTimer);
            if (on) { wakeErrors = 0; startRecognition('wake', silent); }
            else { clearAwait(); if (recMode === 'wake') stopRecognition(); }
            setStatus();
        }

        function toggleHandsFree() {
            if (!SR) { alert('Tu navegador no soporta reconocimiento de voz. Usa Chrome, Edge o Safari.'); return; }
            setHandsFree(!handsFree, false);
            if (handsFree) chime([660]);
        }

        function toggleMic() {
            if (!SR || busy) return;
            if (recMode === 'push') { try { recognition.stop(); } catch (e) {} return; }
            stopSpeaking();
            $('userInput').value = '';
            startRecognition('push', false);
        }

        /* ---------------- DOM ---------------- */
        function scrollDown(force) {
            const c = $('chatScroll');
            if (force || c.scrollHeight - c.scrollTop - c.clientHeight < 150) c.scrollTop = c.scrollHeight;
        }

        function createAIRow(html) {
            const container = $('chatScroll');
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.innerHTML = '<div class="avatar"><div class="ai-avatar-img"></div></div><div class="message-content"></div>';
            const content = row.querySelector('.message-content');
            content.innerHTML = html || '';
            container.appendChild(row);
            scrollDown(true);
            return { row, content };
        }

        function appendDOMMessage(sender, text, extra) {
            if (sender === 'ai') { createAIRow(renderMarkdown(text)); return; }
            const container = $('chatScroll');
            const row = document.createElement('div');
            row.className = 'message-row user';

            let imgsHTML = '';
            if (extra && extra.urls && extra.urls.length) {
                imgsHTML = '<div class="msg-images">' + extra.urls.map(u => '<img src="' + u + '" alt="imagen adjunta">').join('') + '</div>';
            } else if (extra && extra.count) {
                imgsHTML = '<div class="msg-img-chip">📷 ' + extra.count + (extra.count > 1 ? ' imágenes adjuntas' : ' imagen adjunta') + '</div>';
            }
            const textHTML = text ? '<div>' + escapeHtml(String(text)) + '</div>' : '';

            row.innerHTML =
                '<div class="avatar"><i data-lucide="user" style="width: 18px; height: 18px;"></i></div>' +
                '<div class="message-content">' + imgsHTML + textHTML + '</div>';
            container.appendChild(row);
            lucide.createIcons();
            scrollDown(true);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        window.onload = initApp;
    </script>
</body>
</html>
