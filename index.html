<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Asistente IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="preload" as="image" href="/static/jarvis_icono.jpg?v=1">
    <link rel="preload" as="image" href="/static/jarvis_voz.gif?v=1">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://unpkg.com/lucide@0.439.0/dist/umd/lucide.min.js"></script>

    <style>
    :root {
        --bg: #04070f;
        --panel: rgba(8, 16, 34, 0.78);
        --panel-solid: #0a1226;
        --line: rgba(0, 229, 255, 0.22);
        --line-strong: rgba(0, 229, 255, 0.55);
        --accent: #00e5ff;
        --accent2: #7c4dff;
        --text: #e8f4ff;
        --muted: #8aa0b8;
        --danger: #ff4d6d;
        --glow: 0 0 18px rgba(0, 229, 255, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', sans-serif;
        color: var(--text);
        display: flex;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background:
            radial-gradient(ellipse 60% 50% at 15% 0%, rgba(0, 229, 255, 0.14), transparent 70%),
            radial-gradient(ellipse 55% 50% at 95% 100%, rgba(124, 77, 255, 0.16), transparent 70%),
            var(--bg);
    }

    /* Rejilla HUD y líneas de escaneo */
    body::before {
        content: '';
        position: fixed; inset: 0;
        background-image:
            linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
        background-size: 46px 46px;
        -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
        mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
        animation: gridDrift 18s linear infinite;
        pointer-events: none;
        z-index: 0;
    }
    body::after {
        content: '';
        position: fixed; inset: 0;
        background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.02) 0, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 3px);
        pointer-events: none;
        z-index: 0;
    }
    @keyframes gridDrift { to { background-position: 46px 46px, 46px 46px; } }

    .sidebar, .main-container, .sidebar-backdrop { position: relative; z-index: 1; }

    .icon-btn {
        background: transparent; border: none; color: var(--muted); cursor: pointer;
        padding: 4px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
        transition: color .2s, background .2s, box-shadow .2s;
    }
    .icon-btn:hover { color: var(--accent); background: rgba(0, 229, 255, 0.1); }
    .icon-btn.danger:hover { color: var(--danger); background: rgba(255, 77, 109, 0.1); }

    /* ---------- Barra lateral ---------- */
    .sidebar {
        width: 270px; flex-shrink: 0;
        background: linear-gradient(180deg, rgba(6, 13, 30, 0.92), rgba(5, 9, 22, 0.92));
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        border-right: 1px solid var(--line);
        box-shadow: 4px 0 30px rgba(0, 229, 255, 0.05);
        display: flex; flex-direction: column; padding: 16px; gap: 12px; overflow-y: auto;
    }
    .sidebar-backdrop { display: none; }

    .side-title {
        font-family: 'Orbitron', sans-serif; font-size: 0.68rem; letter-spacing: 2px;
        color: var(--accent); padding-left: 4px; opacity: 0.9;
    }

    .new-chat-btn {
        background: linear-gradient(135deg, rgba(0, 229, 255, 0.14), rgba(124, 77, 255, 0.14));
        border: 1px solid var(--line-strong); color: var(--text);
        padding: 11px; border-radius: 10px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        font-weight: 500; font-family: inherit; letter-spacing: .3px;
        transition: box-shadow .25s, transform .15s;
    }
    .new-chat-btn:hover { box-shadow: var(--glow); transform: translateY(-1px); }

    .history-list { flex: 1; min-height: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }

    .history-item {
        display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 10px;
        border-radius: 8px; cursor: pointer; font-size: 0.85rem; color: var(--muted);
        border: 1px solid transparent; transition: all .2s;
    }
    .history-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-actions { display: none; gap: 2px; flex-shrink: 0; }
    .history-item:hover { background: rgba(0, 229, 255, 0.06); color: var(--text); }
    .history-item.active {
        background: rgba(0, 229, 255, 0.1); color: var(--text);
        border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent);
    }
    .history-item:hover .history-actions, .history-item.active .history-actions { display: flex; }
    @media (hover: none) { .history-actions { display: flex; } }

    .side-section {
        display: flex; flex-direction: column; gap: 8px; padding-top: 12px;
        border-top: 1px solid var(--line);
    }
    .side-btn {
        background: transparent; color: var(--text); border: 1px solid var(--line);
        border-radius: 8px; padding: 9px 10px; font-size: 0.82rem; font-family: inherit; cursor: pointer;
        transition: all .2s;
    }
    .side-btn:hover { border-color: var(--accent); box-shadow: var(--glow); }
    .side-btn.primary { background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(124, 77, 255, 0.2)); border-color: var(--line-strong); }
    .side-link { background: none; border: none; color: var(--muted); font-size: 0.75rem; cursor: pointer; text-align: left; padding-left: 4px; font-family: inherit; }
    .side-link:hover { color: var(--danger); }
    .google-status { font-size: 0.78rem; color: var(--muted); padding-left: 4px; word-break: break-all; }
    .google-status.ok { color: #5cffb0; }

    .side-section select {
        width: 100%; background: rgba(2, 6, 18, 0.9); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
        font-size: 0.8rem; font-family: inherit; outline: none;
    }
    .side-section select:focus { border-color: var(--accent); box-shadow: var(--glow); }

    /* ---------- Principal ---------- */
    .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-width: 0; }

    header {
        height: 66px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
        padding: 0 24px; background: var(--panel);
        -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 1px 24px rgba(0, 229, 255, 0.08);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-name {
        font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.05rem; letter-spacing: 4px;
        text-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
    }
    .menu-btn { display: none; color: var(--text); }

    /* Logo con anillo giratorio */
    .brand-logo { position: relative; width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; }
    .brand-logo::before {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, var(--accent), transparent 30%, var(--accent2), transparent 65%, var(--accent));
        animation: spin 7s linear infinite;
        filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.7));
    }
    .brand-logo-img {
        position: absolute; inset: 3px; border-radius: 50%; background-color: #000;
        background-image: url("/static/jarvis_icono.jpg?v=1");
        background-size: cover; background-position: center; background-repeat: no-repeat;
    }
    .ai-avatar-img {
        width: 100%; height: 100%;
        background-image: url("/static/jarvis_icono.jpg?v=1");
        background-size: cover; background-position: center; background-repeat: no-repeat;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Cuando Jarvis habla: logo y avatar del último mensaje pasan a la esfera animada */
    .speaking .brand-logo-img,
    .speaking .message-row.ai:last-child .ai-avatar-img {
        background-image: url("/static/jarvis_voz.gif?v=1");
        background-size: 160%;
    }
    body[data-state="speaking"] .brand-logo { filter: drop-shadow(0 0 14px rgba(0, 229, 255, 0.9)); }
    body[data-state="thinking"] .brand-logo::before { animation-duration: 1.2s; }
    body[data-state="listening"] .brand-logo::before { background: conic-gradient(from 0deg, var(--danger), transparent 35%, var(--accent2), transparent 70%, var(--danger)); animation-duration: 2s; }

    /* Estado */
    .status-chip {
        display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 20px;
        border: 1px solid var(--line); background: rgba(0, 229, 255, 0.06);
        font-family: 'Orbitron', sans-serif; font-size: 0.62rem; letter-spacing: 1.5px; color: var(--accent);
        white-space: nowrap;
    }
    .status-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #5cffb0; box-shadow: 0 0 8px #5cffb0; }
    body[data-state="thinking"] .status-chip .dot { background: #ffd24d; box-shadow: 0 0 8px #ffd24d; animation: pulse 0.8s infinite; }
    body[data-state="speaking"] .status-chip .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 0.6s infinite; }
    body[data-state="listening"] .status-chip { color: var(--danger); border-color: rgba(255, 77, 109, 0.5); }
    body[data-state="listening"] .status-chip .dot { background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: pulse 0.7s infinite; }
    body[data-state="armed"] .status-chip .dot { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.8); } }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-btn { padding: 8px; color: var(--accent); border: 1px solid var(--line); border-radius: 10px; }
    .header-btn.muted { color: var(--muted); }
    .header-btn.active { background: rgba(124, 77, 255, 0.22); border-color: var(--accent2); color: #fff; box-shadow: 0 0 16px rgba(124, 77, 255, 0.6); }

    .model-pill {
        background: rgba(0, 229, 255, 0.06); border: 1px solid var(--line); padding: 5px 12px;
        border-radius: 20px; font-size: 0.78rem; color: var(--accent); display: flex; align-items: center; gap: 6px;
    }

    /* ---------- Chat ---------- */
    .chat-scroll { flex: 1; overflow-y: auto; padding: 26px 24px; display: flex; flex-direction: column; gap: 22px; }

    .message-row { display: flex; gap: 14px; max-width: 820px; margin: 0 auto; width: 100%; animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .message-row.user { flex-direction: row-reverse; }

    .avatar {
        width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        background: #000; overflow: hidden; border: 1px solid var(--line-strong); box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
    }
    .message-row.user .avatar { background: linear-gradient(135deg, var(--accent2), #4d7cff); border-color: rgba(124, 77, 255, 0.7); color: #fff; box-shadow: 0 0 10px rgba(124, 77, 255, 0.4); }

    .message-content {
        position: relative; padding: 14px 18px; font-size: 0.95rem; line-height: 1.55;
        word-break: break-word; min-width: 0;
        background: linear-gradient(135deg, rgba(0, 229, 255, 0.08), rgba(8, 16, 34, 0.85) 55%);
        border: 1px solid var(--line); border-radius: 4px 16px 16px 16px;
        box-shadow: 0 0 22px rgba(0, 229, 255, 0.06), inset 0 0 24px rgba(0, 229, 255, 0.03);
        -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    /* Esquina tipo HUD */
    .message-content::before {
        content: ''; position: absolute; top: -1px; left: -1px; width: 14px; height: 14px;
        border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); border-radius: 4px 0 0 0;
        filter: drop-shadow(0 0 4px var(--accent));
    }
    .message-row.user .message-content {
        background: linear-gradient(135deg, rgba(124, 77, 255, 0.22), rgba(20, 14, 50, 0.85));
        border-color: rgba(124, 77, 255, 0.45); border-radius: 16px 4px 16px 16px;
        box-shadow: 0 0 22px rgba(124, 77, 255, 0.1);
    }
    .message-row.user .message-content::before { left: auto; right: -1px; border-left: none; border-right: 2px solid var(--accent2); border-radius: 0 4px 0 0; filter: drop-shadow(0 0 4px var(--accent2)); }

    .message-content p + p, .message-content ul, .message-content ol, .message-content pre { margin-top: 10px; }
    .message-content ul, .message-content ol { padding-left: 22px; }
    .message-content a { color: var(--accent); }
    .message-content strong { color: #fff; }
    .message-content pre {
        background: rgba(2, 6, 18, 0.9); border: 1px solid var(--line); border-radius: 10px;
        padding: 12px; overflow-x: auto; font-size: 0.85rem;
    }
    .message-content code { font-family: 'Consolas', 'Courier New', monospace; font-size: 0.88em; color: #b8f3ff; }
    .message-content .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    .message-content table { display: block; overflow-x: auto; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    .message-content th, .message-content td { border: 1px solid var(--line); padding: 6px 10px; }
    .message-content th { background: rgba(0, 229, 255, 0.08); }

    .message-content.streaming::after { content: '▋'; color: var(--accent); margin-left: 2px; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .msg-images { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .msg-images img { max-width: 220px; max-height: 180px; border-radius: 10px; border: 1px solid var(--line-strong); object-fit: cover; }
    .msg-img-chip { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }

    /* ---------- Entrada ---------- */
    .attach-preview {
        display: none; gap: 10px; padding: 10px 24px 0; flex-wrap: wrap; flex-shrink: 0;
        background: var(--panel); border-top: 1px solid var(--line);
    }
    .attach-item { position: relative; width: 64px; height: 64px; }
    .attach-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--line-strong); }
    .attach-remove {
        position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
        border: none; background: var(--danger); color: #fff; font-size: 14px; line-height: 1; cursor: pointer;
    }

    .input-container {
        padding: 16px 24px 20px; display: flex; gap: 10px; width: 100%; flex-shrink: 0;
        background: var(--panel); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        border-top: 1px solid var(--line); box-shadow: 0 -1px 24px rgba(0, 229, 255, 0.06);
        transition: box-shadow .3s;
    }
    body[data-state="listening"] .input-container { box-shadow: 0 -1px 30px rgba(255, 77, 109, 0.25); }

    input[type="text"] {
        flex: 1; min-width: 0; background: rgba(2, 6, 18, 0.85); border: 1px solid var(--line);
        padding: 13px 18px; border-radius: 12px; color: var(--text); font-size: 0.95rem; font-family: inherit; outline: none;
        transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]::placeholder { color: #5d7390; }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 20px rgba(0, 229, 255, 0.25); }
    input[type="text"]:disabled { opacity: 0.6; }

    .send-button, .mic-button, .attach-button {
        width: 46px; height: 46px; border-radius: 12px; cursor: pointer; display: flex; align-items: center;
        justify-content: center; flex-shrink: 0; transition: all .2s; font-family: inherit;
    }
    .send-button { background: linear-gradient(135deg, var(--accent), #4d9bff 60%, var(--accent2)); border: none; color: #04101f; box-shadow: 0 0 18px rgba(0, 229, 255, 0.45); }
    .send-button:hover { transform: translateY(-1px); box-shadow: 0 0 26px rgba(0, 229, 255, 0.7); }
    .mic-button { background: transparent; border: 1px solid var(--line-strong); color: var(--accent); }
    .attach-button { background: transparent; border: 1px solid var(--line); color: var(--text); }
    .mic-button:hover, .attach-button:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow); }
    .mic-button.listening { background: var(--danger); border-color: var(--danger); color: #fff; animation: micPulse 1.2s infinite; }
    @keyframes micPulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.6); }
        70% { box-shadow: 0 0 0 14px rgba(255, 77, 109, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); }
    }
    .send-button:disabled, .mic-button:disabled, .attach-button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.25); border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ---------- Móvil ---------- */
    @media (max-width: 760px) {
        .menu-btn { display: flex; }
        header { padding: 0 12px; }
        .brand-name { letter-spacing: 2px; font-size: 0.9rem; }
        .model-pill { display: none; }
        .status-chip { font-size: 0.55rem; padding: 4px 8px; }
        .chat-scroll { padding: 16px 12px; }
        .input-container { padding: 12px; gap: 8px; }
        .attach-preview { padding: 10px 12px 0; }
        .msg-images img { max-width: 150px; }
        .sidebar { position: fixed; top: 0; bottom: 0; left: -300px; z-index: 20; transition: left .25s ease; width: 280px; }
        .sidebar.open { left: 0; }
        .sidebar-backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 10; }
    }
    @media (max-width: 480px) { .status-chip #statusText { display: none; } }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    </style>
</head>
<body data-state="idle">

    <div class="sidebar-backdrop" id="backdrop" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <button class="new-chat-btn" onclick="createNewChat(true); closeSidebar();">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i> Nuevo Chat
        </button>

        <div class="side-title">HISTORIAL</div>
        <div class="history-list" id="historyList"></div>

        <div class="side-section" id="googleBox">
            <div class="side-title">CORREO Y TAREAS</div>
            <div class="google-status" id="googleStatus">Comprobando…</div>
            <button class="side-btn" id="googleConnectBtn" onclick="connectGoogle()" style="display:none">🔗 Conectar Google</button>
            <button class="side-btn primary" id="pendingBtn" onclick="askPending()" style="display:none">📋 Mis pendientes</button>
            <button class="side-link" id="googleDisconnect" onclick="disconnectGoogle()" style="display:none">Desconectar cuenta</button>
        </div>

        <div class="side-section">
            <div class="side-title">VOZ DE JARVIS</div>
            <select id="voiceSelect" onchange="changeVoice(this.value)"></select>
        </div>
    </div>

    <div class="main-container">
        <header>
            <div class="brand">
                <button class="icon-btn menu-btn" onclick="toggleSidebar()" title="Menú">
                    <i data-lucide="menu" style="width: 22px; height: 22px;"></i>
                </button>
                <div class="brand-logo"><div class="brand-logo-img"></div></div>
                <span class="brand-name">JARVIS</span>
                <div class="status-chip"><span class="dot"></span><span id="statusText">EN LÍNEA</span></div>
            </div>
            <div class="header-right">
                <button class="icon-btn header-btn" id="handsBtn" onclick="toggleHandsFree()" title="Modo manos libres: di «Okey Jarvis»">
                    <i data-lucide="radio" style="width: 18px; height: 18px;"></i>
                </button>
                <button class="icon-btn header-btn" id="voiceBtn" onclick="toggleVoice()" title="Activar o silenciar la voz"></button>
                <div class="model-pill">
                    <i data-lucide="brain-circuit" style="width: 14px; height: 14px;"></i>
                    <span id="modelName">Gemini</span>
                </div>
            </div>
        </header>

        <div class="chat-scroll" id="chatScroll"></div>

        <div class="attach-preview" id="attachPreview"></div>

        <div class="input-container">
            <input type="file" id="fileInput" accept="image/*" multiple hidden onchange="addFiles(this.files); this.value='';">
            <button class="attach-button" id="attachBtn" onclick="document.getElementById('fileInput').click()" title="Adjuntar foto">
                <i data-lucide="paperclip" style="width: 18px; height: 18px;"></i>
            </button>
            <button class="mic-button" id="micBtn" onclick="toggleMic()" title="Hablar con Jarvis">
                <i data-lucide="mic" style="width: 18px; height: 18px;"></i>
            </button>
            <input type="text" id="userInput" placeholder="Escribe, habla o envía una foto..." onkeydown="handleKey(event)" autocomplete="off">
            <button class="send-button" id="sendBtn" onclick="sendMsg()" title="Enviar">
                <i data-lucide="arrow-up" style="width: 18px; height: 18px;"></i>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        if (window.marked) marked.setOptions({ breaks: true });

        const $ = (id) => document.getElementById(id);
        const PLACEHOLDER = 'Escribe, habla o envía una foto...';

        /* ---------------- Estado ---------------- */
        let chats = [];
        try { chats = JSON.parse(localStorage.getItem('jarvis_chats')) || []; } catch (e) { chats = []; }
        let currentChatId = localStorage.getItem('jarvis_current_id') || null;
        let busy = false;

        let voiceEnabled = localStorage.getItem('jarvis_voice') !== 'off';

        async function addFiles(fileList) {
            const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/'));
            for (const f of files) {
                if (pendingImages.length >= MAX_IMAGES) { alert('Puedes enviar hasta ' + MAX_IMAGES + ' fotos por mensaje.'); break; }

            }
            renderAttachPreview();

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const MAX = 1800;
                    let w = img.naturalWidth, h = img.naturalHeight;
                    const scale = Math.min(1, MAX / Math.max(w, h));
                    w = Math.round(w * scale); h = Math.round(h * scale);
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    URL.revokeObjectURL(url);
                    resolve({ mime: 'image/jpeg', data: dataUrl.split(',')[1], url: dataUrl });
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagen no válida')); };
                img.src = url;
            });
        }

        async function sendMsg(opts) {
            if (busy) return;
            const forceGoogle = !!(opts && opts.forceGoogle);

            if (!txt && pendingImages.length === 0) return;

                const item = { sender: m.sender, text: String(m.text || '').replace(/<[^>]*>/g, ' ') + (m.imgs ? ' [imagen adjunta]' : '') };
                if (ref && ref.msg === m && i >= startIdx) item.imagenes = ref.images.map(({ mime, data }) => ({ mime, data }));
                return item;
            });

            const imagenes = pendingImages.map(({ mime, data }) => ({ mime, data }));
            const sentImages = pendingImages.slice();

            stopSpeaking();
            stopPushRecognition();
            clearAwait();

            input.value = '';

            renderAttachPreview();

            const userMsg = addMessage(chatId, 'user', txt, sentImages.length ? { imgs: sentImages.length } : null);
            if (sentImages.length && userMsg) chatImages[chatId] = { msg: userMsg, images: sentImages };
            appendDOMMessage('user', txt, sentImages.length ? { urls: sentImages.map(i => i.url) } : null);

            setBusy(true);

            const { content } = createAIRow('...');
            content.classList.add('streaming');

            let acc = '', spoken = 0, gotFirst = false, streamError = null, renderTimer = null;

            const slowTimer = setTimeout(() => {
                if (!gotFirst) content.textContent = 'Reconectando con el servidor…';
            }, 7000);

            const render = () => { renderTimer = null; content.innerHTML = renderMarkdown(acc); scrollDown(false); };
            const queueRender = () => { if (!renderTimer) renderTimer = setTimeout(render, 50); };

            // Habla por frases mientras el texto va llegando
            const speakPending = (final) => {
                if (!voiceEnabled || currentChatId !== chatId) return;
                if (spoken >= MAX_SPOKEN) return;
                const pending = acc.slice(spoken);
                let end = -1;
                if (final) {
                    end = Math.min(pending.length, 600);
                } else {
                    const re = /[.!?…:;]\s|\n/g;
                    let m;
                    while ((m = re.exec(pending)) !== null) end = m.index + m[0].length;
                    if (end < (voiceMode === 'gemini' ? 120 : 30)) return;
                }
                if (end <= 0) return;
                const segEnd = spoken + end;
                const fences = (acc.slice(0, segEnd).match(/```/g) || []).length;
                if (!final && fences % 2 === 1) return; // no cortar un bloque de código
                speakChunk(acc.slice(spoken, segEnd));
                spoken = segEnd;
            };

            const showError = (msg) => { content.innerHTML = '⚠️ <strong>Error:</strong> ' + escapeHtml(msg); };

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: txt, historial, imagenes, usar_google: forceGoogle })
                });

                if (!res.ok) {
                    let msg = 'Fallo en el servidor';
                    try { const d = await res.json(); msg = d.error || msg; } catch (e) {}
                    throw new Error(msg);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) !== -1) {
                        const raw = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        if (!raw.startsWith('data: ')) continue;

                        let evt;
                        try { evt = JSON.parse(raw.slice(6)); } catch (e) { continue; }

                        if (evt.t) {
                            gotFirst = true;
                            acc += evt.t;
                            queueRender();
                            speakPending(false);
                        } else if (evt.info) {
                            if (!gotFirst) content.textContent = evt.info;
                        } else if (evt.google_expired) {
                            google.connected = false; renderGoogle();
                        } else if (evt.error) {
                            streamError = evt.error;
                        }
                    }
                }

                clearTimeout(slowTimer);
                if (renderTimer) clearTimeout(renderTimer);
                content.classList.remove('streaming');

                if (acc.trim()) {
                    render();
                    addMessage(chatId, 'ai', acc);
                    speakPending(true);
                    if (streamError) content.insertAdjacentHTML('beforeend', '<p>⚠️ ' + escapeHtml(streamError) + '</p>');
                    if (chat.title === 'Nueva conversación') {
                        const base = txt || 'Foto adjunta';
                        chat.title = base.length > 25 ? base.substring(0, 25) + '...' : base;
                        persist();
                        renderHistory();
                    }
                } else {
                    showError(streamError || 'No se recibió respuesta.');
                }
            } catch (e) {
                clearTimeout(slowTimer);
                if (renderTimer) clearTimeout(renderTimer);
                content.classList.remove('streaming');
                if (acc.trim()) { render(); addMessage(chatId, 'ai', acc); }
                else showError(e.message && e.message !== 'Failed to fetch' ? e.message : 'Error de red con el servidor.');
            } finally {
                setBusy(false);
            }
        }

        /* ---------------- Texto: Markdown + fórmulas ---------------- */
        function renderMarkdown(text) {
            const maths = [];
            const stash = (expr, display) => { maths.push({ expr, display }); return 'ZZMATH' + (maths.length - 1) + 'ZZ'; };

            // Las fórmulas se apartan antes de pasar por Markdown (para que no las dañe), pero sin tocar el código
            const parts = String(text).split(/(```[\s\S]*?```|`[^`\n]*`)/g);
            const prepared = parts.map((p, i) => {
                if (i % 2 === 1) return p; // bloque de código: se deja igual
                return p
                    .replace(/\$\$([\s\S]+?)\$\$/g, (m, e) => stash(e, true))
                    .replace(/\\\[([\s\S]+?)\\\]/g, (m, e) => stash(e, true))
                    .replace(/\\\(([\s\S]+?)\\\)/g, (m, e) => stash(e, false))
                    .replace(/(^|[^\\$\w])\$([^\s$](?:[^$\n]*[^\s$])?)\$(?![\w$])/g, (m, pre, e) => pre + stash(e, false));
            }).join('');

            let html = marked.parse(prepared);
            html = html.replace(/ZZMATH(\d+)ZZ/g, (m, n) => {
                const item = maths[Number(n)];
                if (!item) return m;
                try {
                    if (typeof katex === 'undefined') throw new Error('sin katex');
                    return katex.renderToString(item.expr, { displayMode: item.display, throwOnError: false, output: 'html' });
                } catch (e) {
                    return '<code>' + String(item.expr).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</code>';
                }
            });
            return DOMPurify.sanitize(html);
        }

        /* ---------------- Texto para la voz ---------------- */
        function mathToSpeech(e) {
            return String(e)
                .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, ' $1 sobre $2 ')
                .replace(/\\sqrt\{([^{}]*)\}/g, ' raíz de $1 ')
                .replace(/\^\{?2\}?/g, ' al cuadrado ')
                .replace(/\^\{?3\}?/g, ' al cubo ')
                .replace(/\^\{([^{}]*)\}/g, ' elevado a $1 ')
                .replace(/\^(\w)/g, ' elevado a $1 ')
                .replace(/\\(cdot|times)/g, ' por ')
                .replace(/\\div/g, ' entre ')
                .replace(/\\pm/g, ' más menos ')
                .replace(/\\(leq|le)\b/g, ' menor o igual que ')
                .replace(/\\(geq|ge)\b/g, ' mayor o igual que ')
                .replace(/\\neq/g, ' distinto de ')
                .replace(/\\pi/g, ' pi ')
                .replace(/\\[a-zA-Z]+/g, ' ')
                .replace(/[{}]/g, '')
                .replace(/=/g, ' igual a ')
                .replace(/\+/g, ' más ')
                .replace(/\s+/g, ' ');
        }

        function cleanForSpeech(text) {
            return String(text)
                .replace(/```[\s\S]*?```/g, ' bloque de código. ')
                .replace(/```[\s\S]*$/, ' ')
                .replace(/\$\$[\s\S]*?\$\$/g, ' fórmula en pantalla. ')
                .replace(/\\\[[\s\S]*?\\\]/g, ' fórmula en pantalla. ')
                .replace(/\\\(([\s\S]*?)\\\)/g, (m, e) => mathToSpeech(e))
                .replace(/(^|[^\\$\w])\$([^\s$](?:[^$\n]*[^\s$])?)\$(?![\w$])/g, (m, pre, e) => pre + mathToSpeech(e))
                .replace(/<[^>]*>/g, ' ')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
                .replace(/[*#_`>~|]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function splitForTts(text, max) {
            const out = [];
            let rest = text;
            while (rest.length > max) {
                let cut = Math.max(rest.lastIndexOf('. ', max), rest.lastIndexOf('? ', max), rest.lastIndexOf('! ', max));
                if (cut < max * 0.4) cut = rest.lastIndexOf(' ', max);
                if (cut <= 0) cut = max;
                out.push(rest.slice(0, cut + 1).trim());
                rest = rest.slice(cut + 1);
            }
            if (rest.trim()) out.push(rest.trim());
            return out;
        }

        /* ---------------- Comandos de voz y palabra de activación ---------------- */
        const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const WAKE_RE = /(?:\b(?:ok|okay|okey|oquei|oye|hey|ey|hola)\s+)?\b(?:jarvis|yarvis|jarvi|harvis|yarbis|charvis|jarbis|garvis|jarvys|yarvi|jarvez)\b[\s,.:;!¡¿?\-]*/;
        const STOP_RE = /\b(para|detente|callate|silencio|basta|cancela|alto)\b/;

        // Devuelve true si la frase era una orden local (no hace falta preguntarle a la IA)
        function matchLocalCommand(raw) {
            const t = norm(raw).replace(/[.,;:!¡¿?]/g, '').trim();
            if (/^(para|detente|callate|silencio|basta|cancela|alto)\b/.test(t)) return 'stop';
            if (/^((abre|crea|inicia|empieza|haz|hazme) )?(un |una )?(nuevo chat|nueva conversacion|chat nuevo)|^(empieza|empecemos) de nuevo/.test(t)) return 'newchat';
            if (/^(silenciate|silencia|apaga la voz|desactiva la voz|apaga el sonido)/.test(t)) return 'mute';
            if (/^(activa la voz|enciende la voz|prende la voz)/.test(t)) return 'unmute';
            if (/^(desactiva|apaga|termina|sal del) (el )?modo manos libres/.test(t)) return 'handsoff';
            return null;
        }

        /* ---------------- Voz: síntesis ---------------- */
        let speechGen = 0;          // se incrementa cada vez que se corta la voz
        let browserPending = 0;
        let audioQueue = [];
        let audioPlaying = false;
        let currentAudio = null, currentResolve = null, currentUrl = null;

        function scoreVoice(v) {
            const n = v.name.toLowerCase();
            let s = 0;
            if (/natural|neural/.test(n)) s += 100;
            if (/premium|enhanced|mejorada/.test(n)) s += 60;
            if (/online/.test(n)) s += 40;
            if (/google/.test(n)) s += 30;
            if (v.localService === false) s += 10;
            if (/^es[-_](co|mx|us|419|ar)/i.test(v.lang)) s += 15;
            else if (/^es[-_]es/i.test(v.lang)) s += 5;
            return s;
        }

        function spanishVoices() {
            if (!('speechSynthesis' in window)) return [];
            return window.speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang)).sort((a, b) => scoreVoice(b) - scoreVoice(a));
        }

        function pickBrowserVoice() {
            const vs = spanishVoices();
            if (!vs.length) return null;
            if (browserVoiceURI) { const f = vs.find(v => v.voiceURI === browserVoiceURI); if (f) return f; }
            return vs[0];
        }

        function buildVoiceSelect() {
            const sel = $('voiceSelect');
            if (!sel) return;
            sel.innerHTML = '';

            if (ttsAvailable) {
                const mk = (label, list) => {
                    const g = document.createElement('optgroup');
                    g.label = label;
                    list.forEach(([name, desc]) => {
                        const o = document.createElement('option');
                        o.value = 'g:' + name;
                        o.textContent = name + ' · ' + desc;
                        g.appendChild(o);
                    });
                    sel.appendChild(g);
                };
                mk('✨ Voces realistas · recomendadas', GEMINI_VOICES.slice(0, 6));
                mk('✨ Voces realistas · más opciones', GEMINI_VOICES.slice(6));
            }

            const b = document.createElement('optgroup');
            b.label = 'Voces de tu dispositivo';
            const auto = document.createElement('option');
            auto.value = 'b:';
            auto.textContent = 'Automática (la mejor disponible)';
            b.appendChild(auto);
            spanishVoices().forEach(v => {
                const o = document.createElement('option');
                o.value = 'b:' + v.voiceURI;
                o.textContent = v.name + ' (' + v.lang + ')';
                b.appendChild(o);
            });
            sel.appendChild(b);

            sel.value = (voiceMode === 'gemini' && ttsAvailable) ? 'g:' + geminiVoice : 'b:' + browserVoiceURI;
            if (!sel.value) sel.selectedIndex = 0;
        }

        function changeVoice(val) {
            if (val.startsWith('g:')) {
                voiceMode = 'gemini';
                geminiVoice = val.slice(2);
                localStorage.setItem('jarvis_gemini_voice', geminiVoice);
            } else {
                voiceMode = 'browser';
                browserVoiceURI = val.slice(2);
                localStorage.setItem('jarvis_browser_voice', browserVoiceURI);
            }
            localStorage.setItem('jarvis_voice_mode', voiceMode);
            ttsFails = 0;
            if (!voiceEnabled) { voiceEnabled = true; localStorage.setItem('jarvis_voice', 'on'); updateVoiceIcon(); }
            speakText('Hola, soy Jarvis. ¿Te gusta cómo suena mi voz?');
        }

        function browserSpeak(text, gen) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) { resolve(); return; }
                const u = new SpeechSynthesisUtterance(text);
                const v = pickBrowserVoice();
                if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'es-ES'; }
                u.rate = 1.0;
                u.pitch = 1.0;
                browserPending++;
                u.onstart = () => { if (gen === speechGen) document.body.classList.add('speaking'); };
                const fin = () => {
                    if (gen === speechGen) {
                        browserPending = Math.max(0, browserPending - 1);
                        if (browserPending === 0 && !audioPlaying) document.body.classList.remove('speaking');
                    }
                    resolve();
                };
                u.onend = fin;
                u.onerror = fin;
                window.speechSynthesis.speak(u);
            });
        }

        function enqueueGemini(text) {
            const gen = speechGen;
            const p = fetch('/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: text, voz: geminiVoice }),
                signal: ttsAbort.signal
            }).then(r => { if (!r.ok) throw new Error('tts ' + r.status); return r.blob(); })
              .then(b => URL.createObjectURL(b));
            p.catch(() => {});
            audioQueue.push({ p, gen, text });
            if (!audioPlaying) playLoop();
        }

        function playUrl(url, gen) {
            return new Promise((resolve) => {
                const a = new Audio(url);
                currentAudio = a; currentResolve = resolve; currentUrl = url;
                const done = (ok) => {
                    if (currentAudio === a) { currentAudio = null; currentResolve = null; currentUrl = null; }
                    URL.revokeObjectURL(url);
                    resolve(ok);
                };
                a.onended = () => done(true);
                a.onerror = () => done(false);
                if (gen === speechGen) document.body.classList.add('speaking');
                a.play().catch(() => done(false));
            });
        }

        async function playLoop() {
            audioPlaying = true;
            while (audioQueue.length) {
                const item = audioQueue.shift();
                if (item.gen !== speechGen) { item.p.then(u => URL.revokeObjectURL(u)).catch(() => {}); continue; }
                let ok = false;
                try {
                    const url = await item.p;
                    if (item.gen !== speechGen) { URL.revokeObjectURL(url); continue; }
                    ok = await playUrl(url, item.gen);
                } catch (e) { ok = false; }
                if (item.gen !== speechGen) continue;

                if (ok) { ttsFails = 0; }
                else {
                    // La voz realista falló: usa la voz del dispositivo para esta frase
                    ttsFails++;
                    if (ttsFails >= 2) voiceMode = 'browser';
                    await browserSpeak(item.text, item.gen);
                }
            }
            audioPlaying = false;
            if (browserPending === 0) document.body.classList.remove('speaking');
        }

        function speakChunk(text) {
            if (!voiceEnabled) return;
            const clean = cleanForSpeech(text);
            if (!clean) return;
            if (voiceMode === 'gemini' && ttsAvailable) splitForTts(clean, 500).forEach(enqueueGemini);
            else if ('speechSynthesis' in window) browserSpeak(clean, speechGen);
        }

        function speakText(text) { stopSpeaking(); speakChunk(text); }

        function stopSpeaking() {
            speechGen++;
            browserPending = 0;
            audioQueue.forEach(it => it.p.then(u => URL.revokeObjectURL(u)).catch(() => {}));
            audioQueue = [];
            try { ttsAbort.abort(); } catch (e) {}
            ttsAbort = new AbortController();
            if (currentAudio) {
                const a = currentAudio, r = currentResolve, u = currentUrl;
                currentAudio = null; currentResolve = null; currentUrl = null;
                a.pause();
                if (u) URL.revokeObjectURL(u);
                if (r) r(true);
            }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.body.classList.remove('speaking');
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            localStorage.setItem('jarvis_voice', voiceEnabled ? 'on' : 'off');
            if (!voiceEnabled) stopSpeaking();
            updateVoiceIcon();
        }

        function updateVoiceIcon() {
            const btn = $('voiceBtn');
            btn.innerHTML = '<i data-lucide="' + (voiceEnabled ? 'volume-2' : 'volume-x') + '" style="width:18px;height:18px;"></i>';
            btn.classList.toggle('muted', !voiceEnabled);
            lucide.createIcons();
        }

        /* ---------------- Estado visual ---------------- */
        function setStatus() {
            let state = 'idle', label = 'EN LÍNEA';
            const speaking = document.body.classList.contains('speaking');
            if (busy) { state = 'thinking'; label = 'PROCESANDO'; }
            else if (speaking) { state = 'speaking'; label = 'HABLANDO'; }
            else if (recMode === 'push' || awaitingCommand) { state = 'listening'; label = 'ESCUCHANDO'; }
            else if (handsFree && recMode === 'wake') { state = 'armed'; label = 'DI «OKEY JARVIS»'; }
            document.body.dataset.state = state;
            $('statusText').textContent = label;
        }

        function setupMicObserver() {
            // Cada vez que cambia la clase "speaking" del body, se actualiza el estado
            new MutationObserver(setStatus).observe(document.body, { attributes: true, attributeFilter: ['class'] });
            // Marca la última vez que Jarvis habló, para no escucharse a sí mismo
            setInterval(() => { if (document.body.classList.contains('speaking')) lastSpeakTs = Date.now(); }, 250);
        }

        /* ---------------- Micrófono y modo manos libres ---------------- */
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let recMode = 'idle';   // 'idle' | 'push' | 'wake'
        let handsFree = localStorage.getItem('jarvis_handsfree') === 'on';
        let awaitingCommand = false, awaitTimer = null, wakeTimer = null, lastSpeakTs = 0, wakeErrors = 0;
        let audioCtx = null;

        function chime(freqs) {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                const t0 = audioCtx.currentTime;
                (freqs || [660, 990]).forEach((f, i) => {
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    const t = t0 + i * 0.12;
                    o.type = 'sine'; o.frequency.value = f;
                    g.gain.setValueAtTime(0.0001, t);
                    g.gain.exponentialRampToValueAtTime(0.15, t + 0.03);
                    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(t); o.stop(t + 0.3);
                });
            } catch (e) {}
        }

        function clearAwait() {
            awaitingCommand = false;
            clearTimeout(awaitTimer);
            if (recMode !== 'push') $('userInput').placeholder = PLACEHOLDER;
            setStatus();
        }

        function startRecognition(mode, silent) {
            if (!SR) return;
            stopRecognition();
            const r = new SR();
            r.lang = 'es-ES';
            r.interimResults = true;
            r.continuous = (mode === 'wake');
            r.maxAlternatives = 1;
            recognition = r;
            recMode = mode;
            const input = $('userInput');

            r.onstart = () => {
                if (r !== recognition) return;
                if (mode === 'push') { $('micBtn').classList.add('listening'); input.placeholder = 'Escuchando...'; }
                setStatus();
            };
            r.onresult = (e) => {
                if (r !== recognition) return;
                if (mode === 'push') {
                    let finalText = '', interim = '';
                    for (let i = 0; i < e.results.length; i++) {
                        const res = e.results[i];
                        if (res.isFinal) finalText += res[0].transcript; else interim += res[0].transcript;
                    }
                    input.value = (finalText + interim).trim();
                } else {
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        if (e.results[i].isFinal) handleWake(e.results[i][0].transcript);
                    }
                }
            };
            r.onerror = (e) => {
                if (r !== recognition) return;
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    handsFree = false;
                    localStorage.setItem('jarvis_handsfree', 'off');
                    recognition = null; recMode = 'idle';
                    $('micBtn').classList.remove('listening');
                    updateHandsUI(); setStatus();
                    if (!silent) alert('Permite el acceso al micrófono en tu navegador para usar la voz.');
                } else if (e.error === 'audio-capture') {
                    if (!silent) alert('No encuentro ningún micrófono conectado.');
                } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
                    wakeErrors++;
                }
            };
            r.onend = () => {
                if (r !== recognition) return;
                recognition = null;
                recMode = 'idle';
                $('micBtn').classList.remove('listening');
                if (!awaitingCommand) input.placeholder = PLACEHOLDER;
                if (mode === 'push' && input.value.trim() && !busy) sendMsg();   // envía lo que dijiste
                if (handsFree) scheduleWake(mode === 'push' ? 900 : (wakeErrors > 3 ? 3000 : 300));
                setStatus();
            };
            try { r.start(); } catch (e) {}
        }

        function stopRecognition() {
            if (recognition) { const r = recognition; recognition = null; try { r.abort(); } catch (e) {} }
            recMode = 'idle';
            $('micBtn').classList.remove('listening');
            if (!awaitingCommand) $('userInput').placeholder = PLACEHOLDER;
        }

        function stopPushRecognition() { if (recMode === 'push') stopRecognition(); }

        function scheduleWake(ms) {
            clearTimeout(wakeTimer);
            wakeTimer = setTimeout(() => {
                if (handsFree && recMode === 'idle') startRecognition('wake', true);
            }, ms);
        }

        function handleWake(text) {
            const t = norm(text);
            const speakingNow = document.body.classList.contains('speaking') || (Date.now() - lastSpeakTs < 1500);

            // Mientras Jarvis habla solo se aceptan órdenes de parada ("Jarvis, para")
            if (speakingNow) {
                if (WAKE_RE.test(t) && STOP_RE.test(t)) { stopSpeaking(); chime([880]); }
                return;
            }
            if (busy) return;

            if (awaitingCommand) {
                clearAwait();
                if (text.trim().length > 1) runVoiceCommand(text.trim());
                return;
            }

            const m = WAKE_RE.exec(t);
            if (!m) return;
            const rest = text.slice(m.index + m[0].length).trim();
            if (rest.length > 2) {
                runVoiceCommand(rest);
            } else {
                // Solo dijo "Okey Jarvis": suena un aviso y se queda esperando la orden
                awaitingCommand = true;
                chime([660, 990]);
                $('userInput').placeholder = 'Te escucho…';
                clearTimeout(awaitTimer);
                awaitTimer = setTimeout(clearAwait, 8000);
                setStatus();
            }
        }

        function runVoiceCommand(cmd) {
            const local = matchLocalCommand(cmd);
            if (local) {
                chime([990]);
                if (local === 'stop') stopSpeaking();
                else if (local === 'newchat') createNewChat(false);
                else if (local === 'mute') { if (voiceEnabled) toggleVoice(); }
                else if (local === 'unmute') { if (!voiceEnabled) toggleVoice(); }
                else if (local === 'handsoff') setHandsFree(false, true);
                return;
            }
            $('userInput').value = cmd;
            sendMsg();
        }

        function updateHandsUI() {
            const b = $('handsBtn');
            b.classList.toggle('active', handsFree);
            b.title = handsFree ? 'Manos libres ACTIVADO: di «Okey Jarvis». Clic para desactivar'
                                : 'Activar modo manos libres: di «Okey Jarvis»';
        }

        function setHandsFree(on, silent) {
            handsFree = on;
            localStorage.setItem('jarvis_handsfree', on ? 'on' : 'off');
            updateHandsUI();
            clearTimeout(wakeTimer);
            if (on) { wakeErrors = 0; startRecognition('wake', silent); }
            else { clearAwait(); if (recMode === 'wake') stopRecognition(); }
            setStatus();
        }

        function toggleHandsFree() {
            if (!SR) { alert('Tu navegador no soporta reconocimiento de voz. Usa Chrome, Edge o Safari.'); return; }
            setHandsFree(!handsFree, false);
            if (handsFree) chime([660]);
        }

        function toggleMic() {
            if (!SR || busy) return;
            if (recMode === 'push') { try { recognition.stop(); } catch (e) {} return; }
            stopSpeaking();
            $('userInput').value = '';
            startRecognition('push', false);
        }

        /* ---------------- DOM ---------------- */
        function scrollDown(force) {
            const c = $('chatScroll');
            if (force || c.scrollHeight - c.scrollTop - c.clientHeight < 150) c.scrollTop = c.scrollHeight;
        }

        function createAIRow(html) {
            const container = $('chatScroll');
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.innerHTML = '<div class="avatar"><div class="ai-avatar-img"></div></div><div class="message-content"></div>';
            const content = row.querySelector('.message-content');
            content.innerHTML = html || '';
            container.appendChild(row);
            scrollDown(true);
            return { row, content };
        }

        function appendDOMMessage(sender, text, extra) {
            if (sender === 'ai') { createAIRow(renderMarkdown(text)); return; }
            const container = $('chatScroll');
            const row = document.createElement('div');
            row.className = 'message-row user';

            let imgsHTML = '';
            if (extra && extra.urls && extra.urls.length) {
                imgsHTML = '<div class="msg-images">' + extra.urls.map(u => '<img src="' + u + '" alt="imagen adjunta">').join('') + '</div>';
            } else if (extra && extra.count) {
                imgsHTML = '<div class="msg-img-chip">📷 ' + extra.count + (extra.count > 1 ? ' imágenes adjuntas' : ' imagen adjunta') + '</div>';
            }
            const textHTML = text ? '<div>' + escapeHtml(String(text)) + '</div>' : '';

            row.innerHTML =
                '<div class="avatar"><i data-lucide="user" style="width: 18px; height: 18px;"></i></div>' +
                '<div class="message-content">' + imgsHTML + textHTML + '</div>';
            container.appendChild(row);
            lucide.createIcons();
            scrollDown(true);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        window.onload = initApp;
    </script>
</body>
</html>
