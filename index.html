<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Asistente IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Enlace a tu archivo de estilos separado -->
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Panel Lateral -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i> Nuevo Chat
        </button>
        <div style="font-size: 0.75rem; color: #60a5fa; font-weight: 600; padding-left: 4px; letter-spacing: 1px;">HISTORIAL</div>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- Contenedor Principal -->
    <div class="main-container">
        <header>
            <div class="brand">
                <div class="brand-logo">
                    <div class="brand-logo-img"></div>
                </div>
                <span>Jarvis AI</span>
            </div>
            <div class="model-pill">
                <i data-lucide="brain-circuit" style="width: 14px; height: 14px; color: #60a5fa;"></i>
                <span>gemini-3.8-flash</span>
            </div>
        </header>

        <div class="chat-scroll" id="chatScroll"></div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="Habla con Jarvis..." onkeydown="handleKey(event)" autocomplete="off">
            <button class="send-button" onclick="sendMsg()" title="Enviar mensaje">
                <i data-lucide="arrow-up" style="width: 18px; height: 18px;"></i>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let chats = JSON.parse(localStorage.getItem('jarvis_chats')) || [];
        let currentChatId = localStorage.getItem('jarvis_current_id') || null;

        function initApp() {
            if (chats.length === 0) {
                createNewChat();
            } else {
                if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                    currentChatId = chats[0].id;
                }
                loadChat(currentChatId);
            }
            renderHistory();
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Nueva conversación',
                messages: [
                    {
                        sender: 'ai',
                        text: '¡Hola! 🖐️ Sistema Jarvis activado. Soy tu asistente virtual especializado en desarrollo web frontend. 🚀<br><br>Antes de comenzar, dime: ¿cómo te llamas?'
                    }
                ]
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveAndRefresh();
            speakText("Sistema Jarvis activado. ¿Cómo te llamas?");
        }

        function loadChat(id) {
            currentChatId = id;
            localStorage.setItem('jarvis_current_id', currentChatId);
            const chat = chats.find(c => c.id === id);
            if (!chat) return;

            const container = document.getElementById('chatScroll');
            container.innerHTML = '';
            
            chat.messages.forEach(msg => {
                appendDOMMessage(msg.sender, msg.text, false);
            });
            renderHistory();
        }

        function saveAndRefresh() {
            localStorage.setItem('jarvis_chats', JSON.stringify(chats));
            localStorage.setItem('jarvis_current_id', currentChatId);
            loadChat(currentChatId);
        }

        async function sendMsg() {
            const input = document.getElementById('userInput');
            const txt = input.value.trim();
            if (!txt) return;

            input.value = '';
            addMessageToCurrentChat('user', txt);
            appendDOMMessage('user', txt, true);

            const loadId = showLoading();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: txt })
                });
                const data = await res.json();
                removeLoading(loadId);

                if (res.ok) {
                    addMessageToCurrentChat('ai', data.respuesta);
                    appendDOMMessage('ai', data.respuesta, true);
                    speakText(data.respuesta);

                    const activeChat = chats.find(c => c.id === currentChatId);
                    if (activeChat && activeChat.title === 'Nueva conversación') {
                        activeChat.title = txt.length > 25 ? txt.substring(0, 25) + '...' : txt;
                        saveAndRefresh();
                    }
                } else {
                    appendDOMMessage('ai', `⚠️ **Error:** ${data.error || 'Fallo en el servidor'}`, false);
                }
            } catch (e) {
                removeLoading(loadId);
                appendDOMMessage('ai', '⚠️ **Error de red con el servidor.**', false);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/```[\s\S]*?```/g, 'Bloque de código omitido.');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                utterance.pitch = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function addMessageToCurrentChat(sender, text) {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages.push({ sender, text });
                localStorage.setItem('jarvis_chats', JSON.stringify(chats));
            }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerText = chat.title;
                item.onclick = () => loadChat(chat.id);
                list.appendChild(item);
            });
        }

        function handleKey(e) {
            if (e.key === 'Enter') {
                sendMsg();
            }
        }

        function appendDOMMessage(sender, text, save=true) {
            const container = document.getElementById('chatScroll');
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            let avatarHTML = sender === 'user' 
                ? `<div class="avatar"><i data-lucide="user" style="width: 18px; height: 18px;"></i></div>` 
                : `<div class="avatar"><div class="ai-avatar-img"></div></div>`;

            const contentHTML = sender === 'ai' ? marked.parse(text) : escapeHtml(text);

            row.innerHTML = `
                ${avatarHTML}
                <div class="message-content">${contentHTML}</div>
            `;

            container.appendChild(row);

            if (sender === 'ai') {
                attachCopyButtons(row);
            }

            lucide.createIcons();
            container.scrollTop = container.scrollHeight;
        }

        function showLoading() {
            const container = document.getElementById('chatScroll');
            const id = 'load-' + Date.now();
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.id = id;
            row.innerHTML = `
                <div class="avatar"><div class="ai-avatar-img"></div></div>
                <div class="message-content">
                    <div class="typing-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(row);
            lucide.createIcons();
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function attachCopyButtons(scope) {
            scope.querySelectorAll('pre').forEach(pre => {
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.innerHTML = `<i data-lucide="copy" style="width:12px;height:12px;"></i> Copiar`;
                btn.onclick = () => {
                    const codeText = pre.querySelector('code').innerText;
                    navigator.clipboard.writeText(codeText).then(() => {
                        btn.innerHTML = `<i data-lucide="check" style="width:12px;height:12px;"></i> ¡Copiado!`;
                        setTimeout(() => {
                            btn.innerHTML = `<i data-lucide="copy" style="width:12px;height:12px;"></i> Copiar`;
                            lucide.createIcons();
                        }, 2000);
                    });
                };
                pre.appendChild(btn);
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
